services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d urlshortener"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - url-shortener-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - url-shortener-net

  app1:
    image: vinaynpandya/ai-assisted-url-shortener:1.0.0
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: scalable
      DB_URL: jdbc:postgresql://postgres:5432/urlshortener
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INSTANCE_NAME: app1
      APP_BASE_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "8080"
    networks:
      - url-shortener-net

  app2:
    image: vinaynpandya/ai-assisted-url-shortener:1.0.0
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: scalable
      DB_URL: jdbc:postgresql://postgres:5432/urlshortener
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INSTANCE_NAME: app2
      APP_BASE_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "8080"
    networks:
      - url-shortener-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - url-shortener-net

volumes:
  pg_data:
  redis_data:

networks:
  url-shortener-net:
    driver: bridge